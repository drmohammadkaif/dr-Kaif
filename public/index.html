<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dr. Kaif</title>
<meta name="apple-mobile-web-app-title" content="Dr. Kaif"><meta name="application-name" content="Dr. Kaif"><meta name="theme-color" content="#0D9488">
<meta name="description" content="Dr. Kaif: study, gym, skin care and internship planner that works offline.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#F6F8FB;
  --ink:#0F172A;
  --mut:#64748B;
  --line:#E2E8F0;
  --ac:#0D9488;
  --act:#fff;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{
  scroll-padding-top:env(safe-area-inset-top,0px);
  overflow-x:hidden;
}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:calc(120px + env(safe-area-inset-bottom,0px));
  overflow-x:hidden;
}
body.modal-open{overflow:hidden}
#app{max-width:1040px;margin:0 auto;padding:16px;overflow-wrap:anywhere}
img,svg,iframe{max-width:100%}

/* Responsive Grid Layout */
.cols{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));
  gap:12px;
  align-items:start;
}
.cols>h1,
.cols>h2,
.cols>.seg,
.cols>.full,
.cols>.sub,
.cols>.row,
.cols>.g2,
.cols>.g3,
.cols>button,
.cols>.sg,
.cols>.hd{
  grid-column:1/-1;
}
.cols>.card{margin:0;min-width:0}
.cols>h2{margin:8px 0 -4px}

h1{font-size:25px;margin:0;letter-spacing:-.02em}
h2{font-size:16px;margin:0}
h3{font-size:15px;margin:0}
.sub{color:var(--mut);font-size:13px}
.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
  margin:10px 0;
  box-shadow:0 1px 2px #0f172a0a;
}
.tint .sub,.sc .sub,.hero .sub{color:inherit;opacity:.85}
.tint .bar,.hero .bar{background:#ffffff40}
.tint .bar i,.hero .bar i{background:currentColor}

.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row>*{min-width:0}
.sp{justify-content:space-between}
.wrap{flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero{background:var(--ac);color:var(--act);border:0}
.big{font-size:34px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}

/* Segmented Control */
.seg{display:flex;background:#E8EDF3;border-radius:12px;padding:3px;gap:2px;margin:4px 0}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:10px;font:600 13px inherit;color:var(--mut);transition:all .15s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px #0002}

/* Buttons & Chips */
button{font:inherit;cursor:pointer}
.btn{border:0;background:var(--ac);color:var(--act);border-radius:12px;padding:9px 13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.btn.o{background:#fff;color:var(--ac);border:1.5px solid var(--ac)}
.btn.s{padding:6px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--ink);min-height:34px;display:inline-flex;align-items:center;gap:4px}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--act)}
.chip.sm{min-height:28px;padding:3px 9px;font-size:12px}
.chip:disabled{opacity:.5;cursor:not-allowed}
.x{border:0;background:none;color:#94A3B8;font-size:16px;padding:6px 10px}
.plus{width:34px;height:34px;border-radius:50%;border:0;background:var(--ac);color:var(--act);font-size:22px;line-height:1;display:grid;place-items:center;padding:0;flex:none;box-shadow:0 2px 6px #0003}
.tint .plus,.hero .plus{background:#fff;color:#0F172A}
.ic{border:0;background:#F1F5F9;color:#64748B;border-radius:9px;width:32px;height:32px;padding:0;font-size:14px;flex:none;display:inline-grid;place-items:center}

/* Bars & Checkboxes */
.bar{height:9px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:6px;transition:width .4s ease}
.chk{display:flex;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line)}
.chk:last-child{border:0}
.box{
  width:24px;height:24px;border-radius:8px;border:2px solid var(--line);
  flex:0 0 24px;display:grid;place-items:center;color:var(--act);font-size:14px;font-weight:700;cursor:pointer;
  transition:background .15s,border-color .15s;
}
.chk.d .box{background:var(--ac);border-color:var(--ac)}
.chk.d .tx{text-decoration:line-through;color:var(--mut)}

/* Inputs */
input,select,textarea{
  font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;
  width:100%;background:#fff;color:var(--ink);min-width:0;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac)}
.row>input,.row>select{flex:1 1 110px;width:auto}
input.n,.row>input.n{width:68px;flex:none;text-align:center;padding:6px 4px}
input.q,.row>input.q{border:0;background:none;font-weight:600;padding:4px 2px;width:100%;flex:1 1 90px}
input.setup{font-size:13px;padding:6px 9px;background:#F8FAFC;border-color:transparent;margin-top:6px}
input.setup:focus{background:#fff;border-color:var(--ac)}
.swt{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0;flex:none}
.swt.sel{box-shadow:0 0 0 3px var(--ink)}
.swc{width:34px!important;height:30px;padding:0;border:0;background:none;flex:none!important}

/* Navigation */
nav{
  position:fixed;left:0;right:0;bottom:0;
  background:#fffffff2;backdrop-filter:blur(8px);
  border-top:1px solid var(--line);
  display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));
  z-index:10;justify-content:center;
}
nav button{flex:1;max-width:160px;border:0;background:none;font-size:11px;font-weight:600;color:var(--mut);padding:4px 0}
nav button b{display:block;font-size:20px;font-weight:400;line-height:1.2}
nav button.on{color:var(--c)}

/* Floating Toasts & Rest Pill */
#float{
  position:fixed;left:12px;right:12px;
  bottom:calc(68px + env(safe-area-inset-bottom,0px));
  z-index:25;display:flex;flex-direction:column;gap:6px;max-width:540px;margin:0 auto;pointer-events:none;
}
.pill{
  background:var(--ink);color:#fff;border-radius:14px;padding:11px 14px;
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  font-weight:600;animation:pop .25s ease-out;box-shadow:0 6px 20px #0f172a33;pointer-events:auto;
}
.pill button{background:#ffffff26;border:0;color:#fff;border-radius:8px;padding:5px 10px;font-weight:600}

/* Tags, Cards & Stepper */
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:#F1F5F9;color:var(--ac);display:inline-block}
.tag.pr{background:#FEF3C7;color:#B45309;animation:pop .35s}
.tag.wu{background:#E2E8F0;color:#475569}
.tag.fl{background:#FEE2E2;color:#DC2626}
.lnk{border-left:3px solid var(--ac);padding:3px 10px;margin:6px 0;font-size:13px;color:#334155}
.sc{border-radius:18px;padding:14px;cursor:pointer;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .12s}
.sc:active{transform:scale(.98)}
.sc b{font-size:15px}
.tp{border-left:6px solid var(--c,var(--ac))}
.stp{display:flex;align-items:center;margin:10px 0 6px}
.nd{
  width:38px;height:38px;border-radius:50%;border:2px solid #CBD5E1;background:#fff;
  display:grid;place-items:center;font-size:11px;font-weight:700;color:#94A3B8;flex:none;padding:0;
}
.nd.on{
  background:var(--c,var(--ac));
  border-color:var(--c,var(--ac));
  color:var(--ct,var(--act));
  animation:pop .35s;
}
.ln{flex:1;height:4px;background:#E2E8F0;border-radius:2px}
.ln.on{background:var(--c,var(--ac))}
.st{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:#F1F5F9}
.st.due{background:#FEF3C7;color:#B45309}
.st.ok{background:#DCFCE7;color:#15803D}
.tile{background:#F8FAFC;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.tile b{font-size:19px;display:block}
.tile .sub{font-size:11px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;text-align:center}
.cd{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:12px;background:#F1F5F9;color:var(--mut)}
.cd.t{background:var(--gy);color:var(--gyt);font-weight:700}
.cd.m{background:#FEE2E2;color:#B91C1C;font-weight:700}
.cd.p{border:1.5px dashed var(--gy);color:var(--ink)}
.xi{max-width:100%;max-height:220px;border-radius:12px;display:block;margin:6px 0;object-fit:contain;background:#F1F5F9;cursor:zoom-in}

/* Plate Calculator Visuals */
.barbell{
  display:flex;align-items:center;justify-content:center;gap:3px;
  background:#F8FAFC;border:1px solid var(--line);border-radius:14px;
  padding:16px 10px;margin:12px 0;min-height:98px;overflow-x:auto;
}
.shaft{height:10px;background:#94A3B8;border-radius:3px;min-width:26px;flex:0 0 auto}
.collar{width:8px;height:22px;background:#475569;border-radius:2px;flex:0 0 auto}
.plate{
  border-radius:5px;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:800;color:#fff;flex:0 0 auto;
  box-shadow:inset 0 0 0 1px #0002;letter-spacing:-.02em;
}
.p20{width:24px;height:66px;background:#2563EB}
.p15{width:22px;height:58px;background:#D97706}
.p10{width:20px;height:50px;background:#16A34A}
.p5{width:18px;height:40px;background:#DC2626}
.p2_5{width:16px;height:32px;background:#334155}
.p1_25{width:14px;height:26px;background:#64748B}

/* Set Chips in Workout */
.setchip{
  border:1.5px solid var(--ac);background:var(--ac);color:var(--act);
  border-radius:999px;padding:5px 10px;font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;gap:5px;cursor:pointer;
}
.setchip.wu{background:#F1F5F9;border-color:#CBD5E1;color:#475569}
.setchip.fl{background:#DC2626;border-color:#DC2626;color:#fff}
.setchip b.stbadge{
  font-size:10px;padding:1px 5px;border-radius:999px;background:#ffffff30;
}
.setchip.wu b.stbadge{background:#CBD5E1;color:#0F172A}

/* Confetti & Animations */
.cf{position:fixed;width:9px;height:9px;border-radius:2px;z-index:90;animation:fly 1s ease-out forwards;pointer-events:none}
@keyframes fly{to{transform:translate(var(--x),calc(var(--y) + 280px)) rotate(var(--r));opacity:0}}
@keyframes pop{0%{transform:scale(.75)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
details{border-bottom:1px solid var(--line);padding:6px 0}
details:last-child{border-bottom:0}
summary{cursor:pointer;font-weight:600;font-size:13px;padding:4px 0}

/* Modals & Sheets */
.mdl{position:fixed;inset:0;background:#0f172a80;display:grid;place-items:center;z-index:40;padding:16px}
.mb{background:#fff;border-radius:18px;padding:18px;max-width:400px;width:100%;box-shadow:0 12px 32px #0f172a33}
.mb img{max-width:100%;max-height:70vh;border-radius:12px;display:block;margin:auto}
.mdl.sheet{place-items:end center;padding:0}
.mb.sh{
  border-radius:20px 20px 0 0;max-width:520px;max-height:90dvh;
  display:flex;flex-direction:column;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));
}
.fb{overflow-y:auto;flex:1;margin-top:6px;padding-right:2px}
#frm{z-index:45}
#hst{z-index:45}
#plt{z-index:50}
#mdl{z-index:60}
#imv{z-index:70}

@media(min-width:700px){
  .mdl.sheet{place-items:center;padding:16px}
  .mb.sh{border-radius:20px}
}

.pw{position:relative}
.pw img{width:64px;height:64px;object-fit:cover;border-radius:10px;display:block;cursor:zoom-in}
.pd{position:absolute;top:-8px;right:-8px;background:#fff;border-radius:50%;box-shadow:0 1px 3px #0003;padding:0 6px!important;line-height:22px}
.rw{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.rw:last-child{border:0}
.rm{flex:1;min-width:0}
.dh{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 2px}
.hd{margin-bottom:4px}
.fl{display:block;margin:10px 0;font-size:12px;color:var(--mut);font-weight:600}
.fl input,.fl select,.fl textarea{margin-top:4px;font-size:15px;color:var(--ink);font-weight:400}
.mcb{max-height:210px;overflow-y:auto;border:1.5px solid var(--line);border-radius:10px;padding:4px 8px;margin-top:4px}
.mc{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:14px;color:var(--ink);font-weight:400;border-bottom:1px solid #F1F5F9;cursor:pointer}
.mc:last-child{border-bottom:0}
.mc input{width:20px;height:20px;margin:0;flex:none}
.up{position:relative;overflow:hidden;display:inline-flex}
.up input[type=file]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:0}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.rings{display:flex;justify-content:space-around;text-align:center;gap:4px}
.rings>div{flex:1;min-width:0}
.rings svg{width:100%;max-width:84px;height:auto}
.rings .sub{font-size:11px}

/* Responsive Breakpoints */
@media(max-width:480px){
  .g2{grid-template-columns:1fr}
  .big{font-size:30px}
  h1{font-size:22px}
  #app{padding:12px}
  .card{padding:12px}
  .cd{font-size:11px}
}
@media(min-width:900px){
  nav{
    top:0;right:auto;width:92px;flex-direction:column;justify-content:flex-start;
    gap:6px;padding:14px 6px;border-top:0;border-right:1px solid var(--line);
  }
  nav button{flex:none;max-width:none;padding:10px 4px;border-radius:12px}
  nav button.on{background:#F1F5F9}
  #app{margin:0 0 0 92px;max-width:none;padding:24px 28px}
  #float{left:120px;right:24px;margin:0;max-width:420px;bottom:24px}
  body{padding-bottom:40px}
}
@media(min-width:1500px){#app{padding:28px 48px}}
@media(max-width:360px){
  nav button{font-size:10px}
  .seg button{font-size:12px}
  .tile b{font-size:16px}
  h1{font-size:20px}
}
body.cmp .card{padding:10px}
body.cmp .chk{padding:5px 2px}
body.cmp .cols{gap:8px}

.i{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic .i,.plus .i,.x .i{width:18px;height:18px;vertical-align:middle}.plus .i{stroke-width:2.6}.x .i{width:16px;height:16px}
nav button b{display:grid;place-items:center;height:28px;font-size:0}nav button b .i{width:23px;height:23px}
.logo{width:42px;height:42px;color:var(--ac);border-radius:12px;object-fit:cover;flex:none}
.chip .i,.btn .i,h3 .i,h2 .i{margin-right:5px}.tag .i{width:.95em;height:.95em;margin-right:3px}.pill .i{margin-right:6px}
.plate{min-width:30px;border-radius:5px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none}
.hd h3{display:flex;align-items:center}
.ic.on{background:var(--ac);color:var(--act)}
.brand{font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--ac)}.navlogo{display:none}
@media(min-width:900px){.navlogo{display:block;margin:2px auto 12px}.navlogo .logo{width:44px;height:44px}}
#offb{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#0F172A;color:#fff;font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;z-index:40;display:none;max-width:92vw;text-align:center}#offb.on{display:block}
</style>
</head>

<div id="app"></div>
<div id="float"></div>
<nav id="nav"></nav>

function shrink(f,cb){
  if(f.type==='application/pdf'){
    if(f.size>3e6){toast('Keep the PDF under 3 MB');return}
    const r=new FileReader();r.onload=()=>cb(putMedia(r.result));r.readAsDataURL(f);
  }else if(f.type==='image/gif'){
    if(f.size>2e6){toast('Keep the GIF under 2 MB');return}
    const r=new FileReader();r.onload=()=>cb(putMedia(r.result));r.readAsDataURL(f);
  }else{
    const im=new Image();
    im.onload=()=>{
      const s=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=im.width*s;c.height=im.height*s;
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      cb(putMedia(c.toDataURL('image/jpeg',.72)));
    };
    im.onerror=()=>toast('Could not read this file');
    im.src=URL.createObjectURL(f);
  }
}

function streak(){
  let s=0;
  for(let i=studyToday()>=30?0:1;;i++){
    if(sumLog(()=>1,td(-i))>=30)s++;
    else break;
  }
  return s;
}

function acc(a){
  const m=S.mcq.filter(x=>x.a===a),n=m.reduce((s,x)=>s+x.n,0);
  return n?m.reduce((s,x)=>s+x.c,0)/n:null;
}

function dueList(){
  const o=[];
  S.subj.forEach((s,si)=>s.t.forEach((t,ti)=>{
    const n=nS(t);
    if(n>=1&&n<4&&t.l){
      const d=ad(t.l,INT[n-1]);
      if(d<=td())o.push({s,si,t,ti,d,n});
    }
  }));
  return o;
}

const weakest=()=>{
  let w=null,wa=2;
  S.subj.forEach(s=>{
    const a=acc(s.n);
    if(a!==null&&a<wa){wa=a;w=s.n}
  });
  return w;
};

function nextTopic(){
  let b=null;
  S.subj.forEach(s=>{
    const t=s.t.find(x=>nS(x)===0);
    if(t){
      const m=sumLog(l=>l.a===s.n);
      if(!b||m<b.m)b={m,t:s.n+': '+t.n};
    }
  });
  return b?b.t:'Add a new topic';
}

function suggest(){
  const sl=lastSleep();
  if(sl&&sl<6)return`Low sleep (${sl} h): keep today light with revision and flashcards; save heavy new topics for tomorrow.`;
  const d=dueList();
  if(d.length)return`Revise ${d[0].t.n} (${d[0].s.n}), due ${d[0].d===td()?'today':'since '+d[0].d}.`;
  const w=weakest();
  return w?`Weakest by MCQ: ${w} (${Math.round(acc(w)*100)}%). Do 30 MCQs there.`:'Log your first study block to get suggestions.';
}

function recItems(kind,all){
  const R0=REC[kind],it=R0.a().map((x,i)=>({x,i}));
  if(all||!R0.k)return it;
  const lim=td(-(RD-1));
  if(R0.sp)return[...it].sort((a,b)=>a.x[R0.k]<b.x[R0.k]?1:-1).slice(0,3);
  return it.filter(o=>o.x[R0.k]>=lim);
}

function rows(kind,items,force){
  const R0=REC[kind];
  let last='',h='';
  [...items].sort((a,b)=>R0.k?(a.x[R0.k]<b.x[R0.k]?1:a.x[R0.k]>b.x[R0.k]?-1:b.i-a.i):a.i-b.i).forEach(o=>{
    const r=R0.r(o.x,o.i),dk=R0.k?o.x[R0.k]:'';
    if(R0.k&&dk!==last){h+=`<div class="dh">${dayLbl(dk)}</div>`;last=dk}

  });
  return h;
}

/* ---------- automation engine ---------- */
const RDESC=r=>r.ac==='prot'?`Protein target +${r.av} g today`:r.ac==='kcal'?`Calorie target +${r.av} kcal today`:r.ac==='water'?`Water target +${r.av} ml today`:r.ac==='goal'?`Study goal set to ${r.av}% today`:r.ac==='habit'?`Habit “${r.msg}” ticked`:r.msg;

function fire(tr,val){
  const x=fxd();
  S.auto.forEach(r=>{
    if(!r.on||r.tr!==tr)return;
    if(tr==='sleep_low'&&!(val<r.tp))return;
    if(x.f[r.id]&&tr!=='mastered')return;
    x.f[r.id]=1;
    const a=+r.av||0;
    if(r.ac==='prot')x.p+=a;
    if(r.ac==='kcal')x.k+=a;
    if(r.ac==='water')x.w+=a;
    if(r.ac==='goal')x.g=a;
    if(r.ac==='habit'){
      const target=String(r.msg||'').trim().toLowerCase();
      const h=S.hab.find(z=>z.n.trim().toLowerCase()===target);
      if(h&&!h.h.includes(td()))h.h.push(td());
    }
    fd(TRIG[tr]+' → '+RDESC(r));
    if(r.ac==='msg'&&r.msg)toast('⟦gear⟧ '+e(r.msg));
  });
}

function chk(){
  if(sg()>0&&studyToday()>=sg())fire('study_goal');
  const T=tot(),B=tg();
  if(T.p>=B.pr)fire('protein');
  if(gv(S.water)>=B.water)fire('water');
}

function body(){
  const m=S.me,h=m.ht/100,w=m.wt,bmi=w/h/h,
    bmr=10*w+6.25*m.ht-5*m.age+(m.sex==='M'?5:-161),
    tdee=bmr*m.act,kc=Math.round(tdee+m.goal),
    pr=Math.round(w*1.8),inch=m.ht/2.54,
    ibw=(m.sex==='M'?50:45.5)+2.3*Math.max(0,inch-60),
    bsa=Math.sqrt(m.ht*w/3600),whtr=m.waist/m.ht,L=Math.log10;
  const bf=m.sex==='M'?
    495/(1.0324-.19077*L(Math.max(1,m.waist-m.neck))+.15456*L(m.ht))-450:
    495/(1.29579-.35004*L(Math.max(1,m.waist+m.hip-m.neck))+.221*L(m.ht))-450;
  const lean=w*(1-bf/100),ffmi=lean/h/h;
  const cat=bmi<18.5?['Underweight','#0EA5E9']:bmi<23?['Normal (Asian cut-off)','#16A34A']:bmi<25?['Overweight risk','#D97706']:['Obese (Asian cut-off)','#DC2626'];
  return{bmi,bmr:Math.round(bmr),tdee:Math.round(tdee),kc,pr,ibw,bsa,whtr,bf,lean,ffmi,cat,water:Math.round(w*35)};
}

function tg(){
  const B=body(),x=fxd(),kc=Math.max(800,B.kc+x.k),pr=Math.max(20,B.pr+x.p),
    fat=Math.max(15,Math.round(kc*.25/9)),
    cb=Math.max(20,Math.round((kc-pr*4-fat*9)/4));
  return{...B,kc,pr,fat,cb,water:Math.max(500,B.water+x.w)};
}

function tot(){
  const x=S.fl.filter(y=>y.d===td());
  return{
    p:x.reduce((a,y)=>a+y.p,0),
    c:x.reduce((a,y)=>a+y.c,0),
    f:x.reduce((a,y)=>a+y.f,0),
    k:x.reduce((a,y)=>a+y.k,0),
    r:x.reduce((a,y)=>a+y.r,0)
  };
}

function gstats(){
  const days=[...Array(28)].map((_,i)=>td(i-27)),pl=d=>S.sched.includes(new Date(d+'T12:00').getDay());
  let pd=0,hit=0,miss=0;
  days.forEach(d=>{
    if(pl(d)&&d<=td()){
      if(trained(d))hit++;
      else if(d<td())miss++;
      if(d<td()||trained(d))pd++;
    }
  });
  let st=0;
  for(let i=1;i<60;i++){
    const d=td(-i);
    if(!pl(d))continue;
    if(trained(d))st++;
    else break;
  }
  if(trained(td())&&pl(td()))st++;
  return{days,pl,hit,miss,adh:pd?Math.round(hit/pd*100):0,st,wn:weekDates().filter(trained).length,wp:S.sched.length};
}

const tx=c=>{
  const n=parseInt(c.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;
  return(r*299+g*587+b*114)/1000>155?'#0F172A':'#fff';
};

function mini(p,c,z=46){
  const r=18,C=2*Math.PI*r;
  return`<svg viewBox="0 0 44 44" width="${z}" height="${z}" style="flex:none">
    <circle cx="22" cy="22" r="${r}" fill="none" stroke="${c}" stroke-opacity=".3" stroke-width="5"/>
    <circle cx="22" cy="22" r="${r}" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-Math.min(1,p))}" transform="rotate(-90 22 22)"/>
    <text x="22" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="${c}">${Math.round(p*100)}</text>
  </svg>`;
}

function ring(p,c,l,t){
  const r=36,C=2*Math.PI*r;
  return`<div>
    <svg viewBox="0 0 92 92">
      <circle cx="46" cy="46" r="${r}" fill="none" stroke="#E8EDF3" stroke-width="10"/>
      <circle cx="46" cy="46" r="${r}" fill="none" stroke="${c}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-Math.min(1,p||0))}" transform="rotate(-90 46 46)"/>
      <text x="46" y="51" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">${Math.round(Math.min(1,p||0)*100)}%</text>
    </svg>
    <div><b>${l}</b></div>
    <div class="sub">${t}</div>
  </div>`;
}

const bar=(p,c,l,r)=>`<div style="margin:8px 0"><div class="row sp"><b>${l}</b><span class="sub">${r}</span></div><div class="bar"><i style="width:${Math.min(100,Math.max(0,(p||0)*100))}%;background:${c}"></i></div></div>`;

function bars(vals,days,line,col){
  const mx=Math.max(line,...vals,1);
  return`<svg viewBox="0 0 280 90" style="width:100%;margin-top:6px">
    ${vals.map((m,i)=>{
      const h=m/mx*60;
      return`<rect x="${i*40+6}" y="${70-h}" width="28" height="${Math.max(2,h)}" rx="5" fill="${col}" opacity="${days[i]===td()?1:.55}"/>
      <text x="${i*40+20}" y="84" text-anchor="middle" font-size="9" fill="#64748B">${DL[new Date(days[i]+'T12:00').getDay()]}</text>`;
    }).join('')}
    <line x1="0" x2="280" y1="${70-line/mx*60}" y2="${70-line/mx*60}" stroke="#94A3B8" stroke-dasharray="4"/>
  </svg>`;
}

function renSub(i,val){
  const o=S.subj[i].n;
  if(!val||val===o)return;
  S.log.forEach(l=>{if(l.a===o)l.a=val});
  S.mcq.forEach(l=>{if(l.a===o)l.a=val});
  S.err.forEach(l=>{if(l.a===o)l.a=val});
  S.cards.forEach(l=>{if(l.s===o)l.s=val});
  S.subj[i].n=val;
}

const fmtT=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};

function logMin(a,m){
  S.log.push({d:td(),a,m,note:TM.mode==='pomo'?'Pomodoro':'Stopwatch'});
  fd(`${m} min on ${a} → ring, streak, chart`);
  chk();
  save();
}

function tmToggle(){
  if(TM.start){
    const el=Math.round((Date.now()-TM.start)/6e4),
      m=TM.mode==='pomo'?Math.min(el,TM.len):el;
    TM.start=0;
    if(m>=1){
      logMin(TM.sub,m);
      toast('⟦timer⟧ Logged '+m+' min');
    }else{
      toast('Focus for at least 1 minute');
    }
  }else{
    if($('#pa'))TM.sub=v('pa');
    TM.start=Date.now();
  }
  render();
}

const nxC=(c,q)=>q<3?1:c.reps===0?1:c.reps===1?3:Math.max(7,Math.round(c.int*c.ease*(q===3?.8:q===5?1.3:1)));

function rateC(i,q){
  const c=S.cards[i],n=nxC(c,q);
  if(q<3)c.reps=0;else c.reps++;
  c.int=n;
  c.ease=Math.max(1.3,c.ease+.1-(5-q)*(.08+(5-q)*.02));
  c.due=td(n);
  S.log.push({d:td(),a:c.s,m:1,note:'Flashcard'});
  FS=0;
  toast('Next review in '+n+' day'+(n>1?'s':''));
  fd('Card reviewed ('+c.s+') → +1 min study, next in '+n+'d');
  if(!S.cards.some(x=>x.due<=td())){FC=0;fire('cards')}
  chk();
  save();
  render();
}

        <div class="g2" style="grid-template-columns:repeat(4,1fr)">
          ${[['Again',0],['Hard',3],['Good',4],['Easy',5]].map(r=>`<button class="btn s" onclick="rateC(${cur.i},${r[1]})">${r[0]}<br><span style="font-weight:400;font-size:11px">${nxC(cur.c,r[1])}d</span></button>`).join('')}

function srch(q){
  q=q.trim().toLowerCase();
  const o=[];
  if(q)S.subj.forEach((s,si)=>s.t.forEach(t=>{
    if(t.n.toLowerCase().includes(q)||s.n.toLowerCase().includes(q)){
      o.push(`<div class="chk" style="cursor:pointer" onclick="SEL=${si};render();scrollTo(0,0)"><span class="box" style="background:${s.c};border-color:${s.c}"></span><div style="flex:1"><b>${e(t.n)}</b><div class="sub">${e(s.n)} · ${nS(t)}/4 stages</div></div>⟦chevr⟧</div>`);
    }
  }));
  $('#sr').innerHTML=q?(o.slice(0,8).join('')||'<div class="sub" style="margin-top:6px">No topic found</div>'):'';
}

function stg(si,ti,j){
  const t=S.subj[si].t[ti],on=!t.s[j];
  for(let q=0;q<4;q++){
    if(on&&q<=j)t.s[q]=1;
    if(!on&&q>=j)t.s[q]=0;
  }
  const n=nS(t);
  if(on){
    t.l=td();
    boom();
    toast(n===4?`⟦trophy⟧ ${e(t.n)} mastered!`:`⟦checkc⟧ ${STG[j]} done · next revision ${ad(td(),INT[n-1])}`);
    fd(`${S.subj[si].n}: ${t.n} → ${STG[j]} done, revision scheduled`);
    if(n===4)fire('mastered');
  }else{
    t.l=n>0?td():'';
  }
  save();
  render();
}

function rev(si,ti){
  const t=S.subj[si].t[ti],n=nS(t);
  if(n>=4)return;
  t.s[n]=1;
  t.l=td();
  const nextCount=n+1;
  boom();
  toast(nextCount===4?`⟦trophy⟧ ${e(t.n)} mastered!`:`⟦sparkle⟧ ${STG[n]} done · next in ${INT[nextCount-1]} days`);
  fd(`Revised ${t.n} (${STG[n]})`);
  if(nextCount===4)fire('mastered');
  save();
  render();
}

function topicMin(si,ti){
  const s=S.subj[si];
  s.t[ti].m+=30;
  S.log.push({d:td(),a:s.n,m:30,note:s.t[ti].n});
  fd(`+30 min on ${s.t[ti].n} → ${s.n} hours, study ring, streak`);
  toast('⟦timer⟧ +30 min logged');
  chk();
  save();
  render();
}

function addPh(p,inp){
  const f=inp.files[0];
  if(!f)return;
  shrink(f,u=>{
    const k=p.split('.'),l=k.pop(),o=ref(k);
    (o[l]=o[l]||[]).push(u);
    save();
    render();
  });
}

  form('⟦swap⟧ Swap '+cur.n,[
    {k:'nk',l:'Replace with (this session only)',t:'sel',o:opts,v:opts[0][0]}
  ],o=>{
    SWP[idx]=o.nk;

function mv(pi,xi,d){

function comboMacros(cb){
  let p=0,c=0,f=0,k=0,r=0;
  (cb.items||[]).forEach(it=>{
    const fdItem=S.foods.find(x=>x.n===it.f);
    if(fdItem){
      const q=+it.q||1;
      p+=fdItem.p*q;c+=fdItem.c*q;f+=fdItem.f*q;k+=fdItem.k*q;r+=fdItem.r*q;
    }
  });
  return{p,c,f,k,r};
}

function comboForm(i){
  if(!S.foods.length){toast('Add a food in My foods first');return}
  const x=i!=null?S.combos[i]:{n:'',meal:'Post-workout',items:[]};
  const selNames=(x.items||[]).map(it=>it.f);
  form(i!=null?'Edit meal combo':'New meal combo / thali',[
    {k:'n',l:'Combo name (e.g. “Post-Workout Shake”)',t:'text',r:1,v:x.n},
    {k:'meal',l:'Default meal',t:'sel',o:MEALS,v:x.meal},
    {k:'f',l:'Choose foods (1 serving each; you can edit later)',t:'multi',r:1,o:S.foods.map(fdItem=>[fdItem.n,`${fdItem.n} (${fdItem.p}g P · ₹${fdItem.r})`]),v:selNames}
  ],o=>{
    const items=o.f.map(fn=>{
      const old=(x.items||[]).find(z=>z.f===fn);
      return{f:fn,q:old?old.q:1};
    });
    const rec={n:o.n,meal:o.meal,items};
    if(i!=null)S.combos[i]=rec;else S.combos.push(rec);
  },i!=null?'Save':'Create');
}

function logCombo(i){
  const cb=S.combos[i];
  if(!cb)return;
  const m=comboMacros(cb);
  S.fl.push({d:td(),n:'Combo · '+cb.n,q:1,p:m.p,c:m.c,f:m.f,k:m.k,r:m.r,meal:cb.meal||autoMeal()});

  save();
  render();
}

const autoMeal=()=>{const h=new Date().getHours();return h<11?'Breakfast':h<15?'Lunch':h<18?'Snack':'Dinner'};

function mealForm(i){
  if(i!=null){
    const x=S.fl[i],u=x.q||1;
    form('Edit meal · '+x.n,[
      {k:'q',l:'Quantity (servings)',t:'num',r:1,v:x.q},

      {k:'d',l:'Date',t:'date',v:x.d}
    ],o=>{
      const q=+o.q;

      Object.assign(x,{p:x.p*s,c:x.c*s,f:x.f*s,k:x.k*s,r:x.r*s,q,meal:o.meal,d:o.d||x.d});
      chk();
    });
    return;
  }
  if(!S.foods.length){toast('Add a food in My foods first');return}
  form('Log a meal',[
    {k:'f',l:'Food',t:'sel',o:S.foods.map((f,j)=>[j,f.n]),v:0},
    {k:'q',l:'Quantity (servings)',t:'num',r:1,v:1},
    {k:'meal',l:'Meal',t:'sel',o:MEALS,v:autoMeal()},
    {k:'d',l:'Date',t:'date',v:td()}

const rnd=w=>Math.round(w/2.5)*2.5,wu=w=>`${rnd(w*.5)}×8 · ${rnd(w*.7)}×5 · ${rnd(w*.85)}×3`;
const est1RM=(w,r)=>w>0?w*(1+r/30):r;

function stepW(k,delta){
  const el=$('#w_'+k);
  if(!el)return;
  const nv=Math.max(0,(+el.value||0)+delta);
  el.value=nv;
  winSet(k,'w',nv);
}

function copyLastSets(k){
  const pv=S.lifts[k];
  if(!pv||!pv.sets||!pv.sets.length){toast('No previous record found');return}
  W[k]=pv.sets.map(r=>({w:pv.w,r,t:'1'}));
  toast('⟦clip2⟧ Copied '+pv.sets.length+' sets ('+pv.w+' kg)');
  render();
}

function cycleSetType(k,i){
  const s=W[k][i];
  s.t=s.t==='1'?'W':s.t==='W'?'F':'1';
  render();
}

function session(){
  const pl=S.plans[SES];
  if(!pl){SES=null;return work()}
  if(!SST)SST=Date.now();
  return`<div class="row sp">
    <h3>${e(pl.n)} <span class="sub" id="sst"></span></h3>
    <span class="row" style="flex-wrap:nowrap">
      <button class="chip sm" onclick="openPlates(60)" aria-label="Plate calculator" title="Plate calculator">⟦calc⟧</button>
      <button class="chip sm" onclick="cancelSes()">Cancel</button>
    </span>
  </div>
  ${pl.x.map((origK,idx)=>{
    const k=SWP[idx]||origK;
    const x=S.ex[k];
    if(!x)return'';
    const pv=S.lifts[k],up=pv&&pv.sets.every(r=>r>=x.hi),bw=x.q==='Bodyweight',sug=pv?(up&&!bw?pv.w+2.5:pv.w):defW(x);
    W[k]=W[k]||[];
    STYPE[k]=STYPE[k]||'1';
    const d=W[k];
    const workSets=d.filter(y=>y.t!=='W');
    const curBest1RM=workSets.length?Math.max(...workSets.map(y=>est1RM(y.w,y.r))):0;
    const prevBest1RM=pv&&pv.sets.length?Math.max(...pv.sets.map(r=>est1RM(pv.w,r))):0;
    const isPR=PRHIT[k]||(pv&&workSets.length&&(Math.max(...workSets.map(y=>y.w))>pv.w||curBest1RM>prevBest1RM+0.5));
    const isBarbell=/barbell|ez bar/i.test(x.q||'');
    let workNum=0;

    return`<div class="card">
      <div class="row sp" style="flex-wrap:nowrap">
        <div>
          <h3>${e(x.n)} ${SWP[idx]?`<span class="tag">Swapped</span>`:''} ${isPR?`<span class="tag pr">⟦trophy⟧ NEW PR!</span>`:''}</h3>
          <div class="sub">${e(x.m)} · ${x.s} × ${Math.max(1,x.hi-4)}–${x.hi} · ⟦bulb⟧ ${e(x.c)}</div>
        </div>
        <span class="row" style="flex-wrap:nowrap">
          ${isBarbell?`<button class="chip sm" onclick="openPlates(+$('#w_${k}').value||${sug})">⟦calc⟧</button>`:''}
          <button class="chip sm" onclick="swapForm(${idx},'${k}')" aria-label="Swap exercise" title="Swap exercise">⟦swap⟧</button>
        </span>
      </div>
      ${avail(x)?'':'<div class="sub" style="color:#B91C1C;margin-top:4px">Your gym setup does not include this equipment. Use Swap.</div>'}
      <input class="setup" placeholder="Setup note (e.g. Seat height 4, wide grip)" value="${e(x.setup||'')}" onchange="P('ex.${k}.setup',this.value)">
      ${x.img?`<img class="xi" src="${mu(x.img)}" alt="" onclick="viewFile(this.src)">`:''}
      ${x.how?`<details><summary>How to do it</summary><div class="sub" style="white-space:pre-wrap">${e(x.how)}</div></details>`:''}
      ${pv?`<div class="row sp" style="margin-top:6px"><span class="sub">Last: ${pv.w} kg × ${pv.sets.join(', ')}</span>${!d.length?`<button class="chip sm" onclick="copyLastSets('${k}')">⟦clip2⟧ Copy last</button>`:''}</div>`:''}
      ${up?`<span class="tag" style="margin-top:4px">+2.5 kg overload → ${sug} kg</span>`:''}
      ${x.hi<=10&&sug>=30?`<div class="sub" style="margin-top:4px">Warm-up: ${wu(sug)}</div>`:''}
      <div class="row" style="margin:8px 0;gap:6px">
        <button class="chip sm ${STYPE[k]==='W'?'on':''}" onclick="STYPE['${k}']='W';render()" title="Warm-up set">W</button>
        <button class="chip sm ${STYPE[k]==='1'?'on':''}" onclick="STYPE['${k}']='1';render()" title="Working set">Work</button>
        <button class="chip sm ${STYPE[k]==='F'?'on':''}" onclick="STYPE['${k}']='F';render()" title="To Failure">Fail</button>
      </div>
      <div class="row" style="margin:8px 0">
        <button class="ic" onclick="stepW('${k}',-2.5)">−</button>
        <input class="n" id="w_${k}" type="number" step="0.5" value="${(WIN[k]&&WIN[k].w!=null)?WIN[k].w:sug}" oninput="winSet('${k}','w',this.value)">
        <button class="ic" onclick="stepW('${k}',2.5)">+</button>
        <span class="sub">kg ×</span>
        <input class="n" id="r_${k}" type="number" value="${(WIN[k]&&WIN[k].r!=null)?WIN[k].r:x.hi}" oninput="winSet('${k}','r',this.value)">
        <button class="btn s" onclick="logSet('${k}')">Log ${STYPE[k]==='W'?'W':STYPE[k]==='F'?'F':'set '+(workSets.length+1)}</button>
      </div>
      <div class="row wrap">${d.map((y,i)=>{
        if(y.t!=='W')workNum++;
        const lbl=y.t==='W'?'W':y.t==='F'?'F':workNum;
        const cls=y.t==='W'?'wu':y.t==='F'?'fl':'';
        return`<span class="setchip ${cls}"><b class="stbadge" onclick="cycleSetType('${k}',${i})" title="Tap to toggle W / Work / Fail">${lbl}</b><span onclick="ask('Remove this set?',()=>{W['${k}'].splice(${i},1);render()},'Yes, remove')">${y.w}×${y.r} ⟦x⟧</span></span>`;
      }).join('')}</div>
      ${workSets.length?`<div class="sub" style="margin-top:6px">${workSets.some(y=>y.w>0)?`1RM ≈ ${Math.round(curBest1RM)} kg · `:''}working volume ${workSets.reduce((a,y)=>a+y.w*y.r,0)} kg${d.length>workSets.length?` (+${d.length-workSets.length} warm-up)`:''}</div>`:''}
    </div>`;
  }).join('')}
  <button class="btn" style="width:100%" onclick="finish()">Finish workout</button>`;
}

function logSet(k){
  const w=+v('w_'+k),r=+v('r_'+k);
  if(w<0||r<=0){toast('Enter a valid weight and reps');return}
  const t=STYPE[k]||'1';
  W[k].push({w,r,t});
  if(t!=='W'){
    const pv=S.lifts[k];
    if(pv&&pv.sets.length){
      const prev1RM=Math.max(...pv.sets.map(x=>est1RM(pv.w,x)));
      const new1RM=est1RM(w,r);
      if((w>pv.w||new1RM>prev1RM+0.5)&&!PRHIT[k]){
        PRHIT[k]=1;
        boom();
        toast('⟦trophy⟧ NEW PR on '+e(S.ex[k].n)+'!');
      }
    }
  }
  R=S.ex[k].rest||90;
  render();
}

function cancelSes(){
  const n=Object.values(W).reduce((a,d)=>a+d.length,0);
  const f=()=>{SES=null;W={};SWP={};STYPE={};PRHIT={};WIN={};SST=0;render()};
  n?ask('Discard '+n+' logged set(s)?',f,'Yes, discard'):f();
}

function finish(){
  const pl=S.plans[SES];
  if(!pl){SES=null;render();return}
  let vol=0,anySet=0;
  const mvm={},ms={};
  Object.keys(W).forEach(k=>{
    const d=W[k];
    if(d.length&&S.ex[k]){
      anySet=1;
      const workOnly=d.filter(y=>y.t!=='W');
      const useSets=workOnly.length?workOnly:d;
      const x=useSets.reduce((a,y)=>a+Math.max(1,y.w)*y.r,0);
      vol+=useSets.reduce((a,y)=>a+y.w*y.r,0);
      const grp=S.ex[k].m;
      mvm[grp]=(mvm[grp]||0)+x;
      ms[grp]=(ms[grp]||0)+workOnly.length;
      if(workOnly.length){
        S.lifts[k]={w:Math.max(...workOnly.map(y=>y.w)),sets:workOnly.map(y=>y.r)};
      }
    }
  });
  if(!anySet){toast('Log at least one set');return}
  const usedKeys=pl.x.map((origK,idx)=>SWP[idx]||origK);
  S.hist.push({
    d:td(),
    n:pl.n,
    vol:Math.round(vol),
    dur:SST?Math.max(1,Math.round((Date.now()-SST)/6e4)):0,
    mv:mvm,
    ms,
    sk:usedKeys.filter(k=>S.ex[k]&&!(W[k]&&W[k].length)).map(k=>S.ex[k].n)
  });
  const len=Math.max(1,S.plans.length);
  S.next=(SES+1)%len;
  SES=null;
  W={};
  SWP={};
  STYPE={};
  PRHIT={};WIN={};
  SST=0;
  boom();
  fd(`Workout done (${Math.round(vol)} kg) → next: ${S.plans[S.next]?S.plans[S.next].n:'Plan'}`);
  toast('⟦dumbbell⟧ Saved · '+Math.round(vol)+' kg volume');
  fire('workout');
  save();
  render();
}

const SYNC={code:'',ver:0,base:0,last:0,state:'off',err:'',busy:false,keys:null,avail:null};
const lsg=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:v}catch(x){return d}},lss=(k,v)=>{try{localStorage.setItem(k,v)}catch(x){}};
function syncLoad(){SYNC.code=lsg('drk_code','');SYNC.ver=+lsg('drk_ver','0')||0;SYNC.base=+lsg('drk_base','0')||0;SYNC.last=+lsg('drk_last','0')||0;SYNC.state=SYNC.code?'idle':'off'}
function syncMeta(){lss('drk_code',SYNC.code);lss('drk_ver',String(SYNC.ver));lss('drk_base',String(SYNC.base));lss('drk_last',String(SYNC.last))}
const ALPHA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

const normCode=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,''),okCode=c=>/^[A-HJ-NP-Z2-9]{20}$/.test(normCode(c)),fmtCode=c=>normCode(c).match(/.{1,5}/g).join('-');
const b64=buf=>{let s='';const a=new Uint8Array(buf);for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s)},unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

const ensureKeys=async()=>{if(!SYNC.keys)SYNC.keys=await deriveKeys(SYNC.code)};
async function gz(data,mode){const S2=mode==='z'?new CompressionStream('gzip'):new DecompressionStream('gzip');return new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(S2)).arrayBuffer())}

const api=(path,opt)=>{opt=opt||{};return fetch('/api'+path,{...opt,cache:'no-store',headers:{authorization:'Bearer '+SYNC.keys.token,...(opt.headers||{})}})};
async function checkAvail(){try{const r=await fetch('/api/health',{cache:'no-store'});const j=await r.json();SYNC.avail=!!(r.ok&&j&&j.app==='dr-kaif')}catch(x){SYNC.avail=navigator.onLine?false:SYNC.avail}return SYNC.avail}
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'};
function choose(title,msg,btns){const x=document.createElement('div');x.id='chs';x.className='mdl';x.style.zIndex=65;x.innerHTML=`<div class="mb"><div style="font-weight:700;margin-bottom:6px">${e(title)}</div><div style="font-size:14px;color:#475569">${e(msg)}</div><div style="display:flex;flex-direction:column;gap:8px;margin-top:14px">${btns.map((b,i)=>`<button class="btn ${b.o?'o':''}" data-i="${i}">${e(b.t)}</button>`).join('')}</div></div>`;document.body.appendChild(x);x.querySelectorAll('button').forEach(bt=>{bt.onclick=()=>{x.remove();btns[+bt.dataset.i].f()}})}
function rerenderSync(){updateBadge();if(tab==='set'&&!FM&&!ASK&&!document.getElementById('chs'))render()}
async function pullData(d){const o=JSON.parse(await decStr(d.blob));snap();S=o;try{migrate()}catch(x){}SYNC.ver=d.ver;SYNC.base=S.rev||0;SYNC.last=Date.now();syncMeta();try{localStorage.setItem('lifeos10',JSON.stringify(S))}catch(x){}setFavicon();render()}

function conflict(d){SYNC.state='conflict';SYNC.busy=false;rerenderSync();choose('Sync conflict','This device and the cloud both have new changes. Which version should be kept? Your current data is also saved as a backup on this device.',[{t:'Use the cloud version',f:async()=>{try{await pullData(d);await syncMedia();SYNC.state='ok'}catch(x){SYNC.state='error';SYNC.err=String(x.message||x)}rerenderSync()}},{t:'Use this device',o:1,f:async()=>{try{await pushData(d.ver);await syncMedia();SYNC.state='ok'}catch(x){SYNC.state='error';SYNC.err=String(x.message||x)}rerenderSync()}}])}

let QT;function queueSync(){clearTimeout(QT);if(SYNC.code)QT=setTimeout(()=>syncNow(),4000);updateBadge()}
async function createSync(){if(!await checkAvail()){toast('Cloud sync is not available on this host');return}toast('Creating your encrypted cloud space…');SYNC.code=newCode();SYNC.keys=null;SYNC.ver=0;SYNC.base=0;SYNC.state='syncing';

if(r.status===404){SYNC.code='';SYNC.state='off';render();choose('No data found for this code','If you are linking a second device, check the code and try again. If this is a brand-new code, you can start a new cloud space with this device’s data.',[{t:'Start a new cloud space',o:1,f:async()=>{SYNC.code=normCode(code);SYNC.keys=null;try{await ensureKeys();await pushData(0);SYNC.state='ok';syncMeta();toast('Connected');}catch(x){SYNC.code='';SYNC.state='error';SYNC.err=String(x.message||x)}rerenderSync()}},{t:'Cancel',f:()=>{}}]);return}
if(!r.ok)throw new Error('Server error '+r.status);const d=await r.json();
choose('Cloud data found','This code already has data. Use it on this device, or replace the cloud with what is on this device?',[{t:'Use the cloud data (recommended)',f:async()=>{try{await pullData(d);syncMeta();await syncMedia();SYNC.state='ok';toast('Linked. Data loaded from the cloud')}catch(x){SYNC.code='';SYNC.state='error';SYNC.err='Wrong code or damaged data'}rerenderSync()}},{t:'Replace cloud with this device',o:1,f:async()=>{try{await pushData(d.ver);syncMeta();await syncMedia();SYNC.state='ok';toast('Connected')}catch(x){SYNC.code='';SYNC.state='error';SYNC.err=String(x.message||x)}rerenderSync()}}])}
catch(x){SYNC.code='';SYNC.state='error';SYNC.err=String(x.message||x);syncMeta();rerenderSync()}}
function syncOff(){SYNC.code='';SYNC.keys=null;SYNC.ver=0;SYNC.base=0;SYNC.last=0;SYNC.state='off';syncMeta();render()}
async function deleteCloud(){try{await ensureKeys();const r=await api('/all',{method:'DELETE'});if(!r.ok)throw new Error('Server error '+r.status);syncOff();toast('Cloud data deleted. Your data on this device is untouched')}catch(x){toast('Could not delete: '+String(x.message||x))}}
function syncStatus(){if(!SYNC.code)return'Not connected';if(SYNC.state==='syncing')return'Syncing…';if(!navigator.onLine)return'Offline. Changes are saved on this device';if(SYNC.state==='error')return'Problem: '+SYNC.err;if(SYNC.state==='conflict')return'Waiting for your choice';return(S.rev||0)>SYNC.base?'Changes waiting to upload':'Up to date'+(SYNC.last?' · '+ago(SYNC.last):'')}

:`<div class="row wrap" style="margin-top:8px"><button class="btn s" onclick="createSync()">Create sync code</button><button class="btn o s" onclick="form('Link this device',[{k:'c',l:'Sync code from your other device',t:'text',r:1,p:'XXXXX-XXXXX-XXXXX-XXXXX'}],o=>{if(!okCode(o.c)){toast('That code does not look right');return false}setTimeout(()=>joinSync(o.c),50)},'Link')">I already have a code</button></div>`}</div>
